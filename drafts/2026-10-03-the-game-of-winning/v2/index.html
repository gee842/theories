<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Game of Winning</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100%;height:auto}</style>
</head><body>
<canvas id="view" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script src="film.js"></script>
<script src="sound.js"></script>
<script>
window.FILM = { ready: false, error: null };
Film.init(document.getElementById("view")).then(() => {
  window.FILM.ready = true;
  window.FILM.frame = (t) => Film.frame(t).toDataURL("image/png");
  window.FILM.audio = async () => { const b = await Sound.render(); window.__wav = Sound.wav(b); return window.__wav.length; };
  window.FILM.audioChunk = (i, size) => { const s = window.__wav.subarray(i, i + size); let bin = ""; for (let j = 0; j < s.length; j += 8192) bin += String.fromCharCode.apply(null, s.subarray(j, j + 8192)); return btoa(bin); };
}).catch(e => { window.FILM.error = String(e && e.stack || e); console.error(e); });
</script>
</body></html>
