<div id="generative-core-explorer">
  <h3>How activity changes what can happen next</h3>
  <div class="text-small text-muted">Five-phase witness · continuing external provision assumed</div>
  <div class="viz-controls">
    <label class="form-label">Inspect a state (starts a new exploration)
      <select class="form-select" id="gc-state">
        <option value="initial">Initial</option>
        <option value="depleted">Depleted</option>
        <option value="revised">Revised</option>
        <option value="ready">Ready</option>
        <option value="terminal">Terminal</option>
      </select>
    </label>
  </div>
  <div id="gc-diagram"></div>
  <div id="gc-detail" aria-live="polite"></div>
  <div class="viz-row" id="gc-events" aria-label="Explore a permitted event"></div>
  <div id="gc-history" class="text-small text-muted" aria-live="polite"></div>
</div>
<style>
  #generative-core-explorer { display: grid; gap: 12px; }
  #generative-core-explorer h3 { padding-right: 92px; margin-bottom: 0; }
  #generative-core-explorer .gc-svg { display: block; width: 100%; }
  #generative-core-explorer .gc-svg text { fill: var(--foreground); }
  #generative-core-explorer .gc-link { stroke: var(--border); stroke-width: 1.5; fill: none; }
  #generative-core-explorer .gc-link.gc-enabled { stroke: var(--viz-series-1); stroke-width: 2; }
  #generative-core-explorer .gc-node { fill: var(--muted); stroke: none; }
  #generative-core-explorer .gc-node.gc-current { fill: color-mix(in srgb, var(--viz-series-1) 22%, var(--background)); }
  #generative-core-explorer .gc-dot { fill: var(--viz-series-1); }
</style>
<script>
(() => {
  const root = document.getElementById('generative-core-explorer');
  const select = root.querySelector('#gc-state');
  const diagram = root.querySelector('#gc-diagram');
  const detail = root.querySelector('#gc-detail');
  const events = root.querySelector('#gc-events');
  const history = root.querySelector('#gc-history');
  const phases = {
    initial: { label: 'Initial', support: 'present', rule: 'use only' },
    depleted: { label: 'Depleted', support: 'absent', rule: 'use only' },
    revised: { label: 'Revised', support: 'absent', rule: 'repair capable' },
    ready: { label: 'Ready', support: 'present', rule: 'repair capable' },
    terminal: { label: 'Terminal', support: 'absent', rule: 'inactive' }
  };
  const edges = [
    { from: 'initial', event: 'use', to: 'depleted' },
    { from: 'depleted', event: 'revise', to: 'revised' },
    { from: 'depleted', event: 'abandon', to: 'terminal' },
    { from: 'revised', event: 'restore', to: 'ready' },
    { from: 'ready', event: 'use', to: 'revised' }
  ];
  let current = 'initial';
  let last = 'Inspection only; no event has occurred.';
  const svgNS = 'http://www.w3.org/2000/svg';
  function svgElement(name, attributes, text) {
    const element = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attributes || {})) element.setAttribute(key, value);
    if (text) element.textContent = text;
    return element;
  }
  function draw() {
    const width = Math.max(280, Math.round(diagram.getBoundingClientRect().width));
    const x = Math.round(width * 0.30);
    const right = width - 61;
    const positions = { initial: [x, 27], depleted: [x, 119], revised: [x, 216], ready: [x, 313], terminal: [right, 119] };
    const svg = svgElement('svg', { class: 'gc-svg', viewBox: `0 0 ${width} 346`, height: 346, role: 'img', 'aria-labelledby': 'gc-title gc-desc' });
    svg.append(svgElement('title', { id: 'gc-title' }, 'Permitted events and current state'));
    svg.append(svgElement('desc', { id: 'gc-desc' }, `Current state: ${phases[current].label}. Initial use reaches depleted. Depleted revise reaches revised; abandon reaches terminal. Revised restore reaches ready with external provision. Ready use returns to revised. Terminal has no permitted event.`));
    const defs = svgElement('defs');
    for (const active of [false, true]) {
      const marker = svgElement('marker', { id: active ? 'gc-arrow-active' : 'gc-arrow', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 6, markerHeight: 6, orient: 'auto' });
      marker.append(svgElement('path', { d: 'M 0 0 L 8 4 L 0 8 Z', fill: active ? 'var(--viz-series-1)' : 'var(--border)' }));
      defs.append(marker);
    }
    svg.append(defs);
    for (const edge of edges) {
      const [sx, sy] = positions[edge.from];
      const [tx, ty] = positions[edge.to];
      let d, lx, ly;
      if (edge.to === 'terminal') {
        d = `M ${sx + 54} ${sy} L ${tx - 56} ${ty}`;
        lx = (sx + tx) / 2; ly = sy - 30;
      } else if (edge.from === 'ready') {
        const bend = Math.min(width - 18, x + 135);
        d = `M ${sx + 54} ${sy} C ${bend} ${sy} ${bend} ${ty} ${tx + 56} ${ty}`;
        lx = Math.min(width - 18, x + 143); ly = (sy + ty) / 2 + 4;
      } else {
        d = `M ${sx} ${sy + 21} L ${tx} ${ty - 23}`;
        lx = sx + 36; ly = (sy + ty) / 2 + 4;
      }
      const active = edge.from === current;
      svg.append(svgElement('path', { d, class: `gc-link${active ? ' gc-enabled' : ''}`, 'marker-end': `url(#${active ? 'gc-arrow-active' : 'gc-arrow'})` }));
      svg.append(svgElement('text', { x: lx, y: ly, 'text-anchor': 'middle', class: 'text-small' }, edge.event));
    }
    for (const [id, [nx, ny]] of Object.entries(positions)) {
      svg.append(svgElement('rect', { x: nx - 54, y: ny - 20, width: 108, height: 40, rx: 7, class: `gc-node${id === current ? ' gc-current' : ''}` }));
      svg.append(svgElement('text', { x: nx, y: ny + 5, 'text-anchor': 'middle' }, phases[id].label));
      if (id === current) svg.append(svgElement('circle', { cx: nx - 44, cy: ny, r: 3, class: 'gc-dot' }));
    }
    diagram.replaceChildren(svg);
  }
  function persist() {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({ modelContent: { phase: current, externalProvision: true }, privateContent: { last } }).catch(() => {});
    }
  }
  function render() {
    select.value = current;
    const state = phases[current];
    detail.textContent = `${state.label} · support ${state.support} · rule: ${state.rule}`;
    history.textContent = last;
    events.replaceChildren();
    const available = edges.filter(edge => edge.from === current);
    if (available.length) {
      const label = document.createElement('span');
      label.className = 'text-small';
      label.textContent = 'Follow a possible event:';
      events.append(label);
    }
    for (const edge of available) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn';
      button.textContent = edge.event.charAt(0).toUpperCase() + edge.event.slice(1);
      button.setAttribute('aria-label', `Explore event ${edge.event}: ${state.label} to ${phases[edge.to].label}`);
      button.addEventListener('click', () => {
        last = `${phases[edge.from].label} → ${edge.event} → ${phases[edge.to].label}`;
        current = edge.to;
        render(); persist();
      });
      events.append(button);
    }
    if (!available.length) {
      const text = document.createElement('span');
      text.textContent = 'No permitted event';
      events.append(text);
    }
    draw();
  }
  function restore(snapshot) {
    if (snapshot && snapshot.modelContent && phases[snapshot.modelContent.phase]) {
      current = snapshot.modelContent.phase;
      last = snapshot.privateContent && typeof snapshot.privateContent.last === 'string' ? snapshot.privateContent.last : 'Inspection only; no event has occurred.';
    }
    render();
  }
  select.addEventListener('change', () => {
    current = select.value;
    last = 'Inspection only; no event has occurred.';
    render(); persist();
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail && event.detail.globals && 'widgetState' in event.detail.globals) restore(event.detail.globals.widgetState);
  });
  restore(window.openai && window.openai.widgetState);
  new ResizeObserver(draw).observe(diagram);
})();
</script>
